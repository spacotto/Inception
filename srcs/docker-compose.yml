version: '3'

services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    volumes:
      - mariadb_vol:/var/lib/mysql
    networks:
      - inception_network
    env_file:
      - .env

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      - inception_network
    env_file:
      - .env

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      - inception_network
    env_file:
      - .env

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      device: /home/spacotto/data/mariadb
      o: bind
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      device: /home/spacotto/data/wordpress
      o: bind

networks:
  inception_network:
    driver: bridge
