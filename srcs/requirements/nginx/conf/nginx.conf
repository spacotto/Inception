server {
    # Listen EXCLUSIVELY on port 443 (HTTPS) for IPv4 and IPv6.
    # Port 80 (HTTP) is deliberately omitted to comply with security requirements.
    listen 443 ssl;
    listen [::]:443 ssl;

    # Strictly match the required domain name
    server_name spacotto.42.fr;

    # SSL/TLS Configuration: Paths to the self-signed certificate and key
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Strictly enforce TLSv1.2 and TLSv1.3 as required by the subject (no SSLv3/TLSv1.1)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Web root directory (matches the WordPress volume mount)
    root /var/www/html;
    index index.php index.html index.htm;

    # Serve static files; if not found, pass the request to WordPress
    location / {
		try_files $uri $uri/ /index.php$is_args$args;
    }

    # Pass PHP scripts to the WordPress container (PHP-FPM) listening on port 9000
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
