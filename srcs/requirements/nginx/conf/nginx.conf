server {
    # Listen on port 443 for IPv4 and IPv6 with SSL enabled
    listen 443 ssl;
    listen [::]:443 ssl;

    # Catch all server name (can also be strictly set to the domain name)
    server_name _;

    # Paths to the SSL certificate and key
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Subject requires exactly TLSv1.2 or TLSv1.3
    ssl_protocols TLSv1.2 TLSv1.3;

    # Web root directory (matches the WordPress volume mount)
    root /var/www/html;
    index index.php index.html index.htm;

    # Serve static files, fallback to 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Pass PHP scripts to the WordPress container (PHP-FPM) listening on port 9000
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
